<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none" class="detective-illustration">
  <defs>
    <style>
      .det-bg { fill: #FAF8F5; transition: fill 0.3s; }
      .det-border { stroke: #E6E0D6; stroke-width: 1.5; transition: stroke 0.3s; }
      .det-grid { stroke: rgba(194, 59, 43, 0.08); stroke-width: 1; }
      .det-dark-fill { fill: #1E2D4A; transition: fill 0.3s; }
      .det-coat { fill: #1E2D4A; transition: fill 0.3s; }
      .det-coat-shadow { fill: #131D31; transition: fill 0.3s; }
      .det-skin { fill: #F7EFE4; transition: fill 0.3s; }
      .det-skin-shadow { fill: #EBDDCB; transition: fill 0.3s; }
      .det-line { stroke: #1C2127; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.3s; }
      .det-thin-line { stroke: #1C2127; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.3s; }
      .det-red { fill: #C23B2B; stroke: #C23B2B; transition: fill 0.3s, stroke 0.3s; }
      .det-red-fill { fill: #C23B2B; transition: fill 0.3s; }
      .det-glass-rim { stroke: #C23B2B; stroke-width: 3; fill: rgba(255, 255, 255, 0.5); }
      .det-glass-glare { fill: rgba(255, 255, 255, 0.7); }
      .det-notebook { fill: #FAF8F5; stroke: #1C2127; stroke-width: 2; }
      .det-city { fill: #E6E0D6; opacity: 0.6; transition: fill 0.3s, opacity 0.3s; }
      .det-moon { fill: #FAF8F5; stroke: #C23B2B; stroke-width: 1.5; stroke-dasharray: 4 4; }

      @media (prefers-color-scheme: dark) {
        .det-bg { fill: #151A22; }
        .det-border { stroke: #283141; }
        .det-grid { stroke: rgba(226, 85, 69, 0.12); }
        .det-dark-fill { fill: #0E1217; }
        .det-coat { fill: #182233; }
        .det-coat-shadow { fill: #0F1622; }
        .det-skin { fill: #D9CEBE; }
        .det-skin-shadow { fill: #B8A995; }
        .det-line { stroke: #ECEEF2; }
        .det-thin-line { stroke: #CBD2DC; }
        .det-red { fill: #E25545; stroke: #E25545; }
        .det-red-fill { fill: #E25545; }
        .det-glass-rim { stroke: #E25545; fill: rgba(30, 45, 74, 0.4); }
        .det-glass-glare { fill: rgba(255, 255, 255, 0.3); }
        .det-notebook { fill: #1D232E; stroke: #CBD2DC; }
        .det-city { fill: #283141; opacity: 0.8; }
        .det-moon { fill: #151A22; stroke: #E25545; }
      }

      :global(.dark) .det-bg { fill: #151A22; }
      :global(.dark) .det-border { stroke: #283141; }
      :global(.dark) .det-grid { stroke: rgba(226, 85, 69, 0.12); }
      :global(.dark) .det-dark-fill { fill: #0E1217; }
      :global(.dark) .det-coat { fill: #182233; }
      :global(.dark) .det-coat-shadow { fill: #0F1622; }
      :global(.dark) .det-skin { fill: #D9CEBE; }
      :global(.dark) .det-skin-shadow { fill: #B8A995; }
      :global(.dark) .det-line { stroke: #ECEEF2; }
      :global(.dark) .det-thin-line { stroke: #CBD2DC; }
      :global(.dark) .det-red { fill: #E25545; stroke: #E25545; }
      :global(.dark) .det-red-fill { fill: #E25545; }
      :global(.dark) .det-glass-rim { stroke: #E25545; fill: rgba(30, 45, 74, 0.4); }
      :global(.dark) .det-glass-glare { fill: rgba(255, 255, 255, 0.3); }
      :global(.dark) .det-notebook { fill: #1D232E; stroke: #CBD2DC; }
      :global(.dark) .det-city { fill: #283141; opacity: 0.8; }
      :global(.dark) .det-moon { fill: #151A22; stroke: #E25545; }
    </style>
  </defs>

  <!-- Background Card / Frame -->
  <rect x="20" y="20" width="460" height="460" rx="16" class="det-bg det-border" />

  <!-- Japanese Grid Pattern -->
  <g class="det-grid">
    <line x1="20" y1="100" x2="480" y2="100" />
    <line x1="20" y1="180" x2="480" y2="180" />
    <line x1="20" y1="260" x2="480" y2="260" />
    <line x1="20" y1="340" x2="480" y2="340" />
    <line x1="20" y1="420" x2="480" y2="420" />
    <line x1="100" y1="20" x2="100" y2="480" />
    <line x1="180" y1="20" x2="180" y2="480" />
    <line x1="260" y1="20" x2="260" y2="480" />
    <line x1="340" y1="20" x2="340" y2="480" />
    <line x1="420" y1="20" x2="420" y2="480" />
  </g>

  <!-- Distant Tokyo Night Skyline Silhouette -->
  <g class="det-city">
    <rect x="50" y="240" width="35" height="180" />
    <rect x="90" y="210" width="45" height="210" />
    <line x1="112" y1="180" x2="112" y2="210" stroke-width="2" class="det-city" />
    <rect x="140" y="270" width="30" height="150" />
    <rect x="330" y="230" width="40" height="190" />
    <rect x="375" y="195" width="50" height="225" />
    <line x1="400" y1="160" x2="400" y2="195" stroke-width="2" class="det-city" />
    <rect x="430" y="260" width="30" height="160" />
  </g>

  <!-- Investigation Moon / Target Reticle -->
  <circle cx="390" cy="110" r="45" class="det-moon" />
  <line x1="390" y1="55" x2="390" y2="70" stroke="#C23B2B" stroke-width="1.5" class="det-red" />
  <line x1="390" y1="150" x2="390" y2="165" stroke="#C23B2B" stroke-width="1.5" class="det-red" />
  <line x1="335" y1="110" x2="350" y2="110" stroke="#C23B2B" stroke-width="1.5" class="det-red" />
  <line x1="430" y1="110" x2="445" y2="110" stroke="#C23B2B" stroke-width="1.5" class="det-red" />

  <!-- Hanko Seal Stamp (Top Right) -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="42" height="42" rx="4" fill="none" stroke="#C23B2B" stroke-width="2" class="det-red" />
    <text x="21" y="17" font-family="'JetBrains Mono', sans-serif" font-size="10" font-weight="bold" fill="#C23B2B" text-anchor="middle" class="det-red-fill">FILE</text>
    <text x="21" y="32" font-family="'JetBrains Mono', sans-serif" font-size="9" font-weight="bold" fill="#C23B2B" text-anchor="middle" class="det-red-fill">CASE</text>
  </g>

  <!-- Detective Figure Group -->
  <g transform="translate(0, 10)">
    <!-- Coat Silhouette / Body -->
    <path d="M120 440 L160 300 L210 270 L250 270 L300 300 L340 440 Z" class="det-coat-shadow" />
    <path d="M140 440 L170 310 L230 285 L250 370 L220 440 Z" class="det-coat" />
    <path d="M320 440 L290 310 L240 285 L250 370 L280 440 Z" class="det-coat" />

    <!-- Trench Coat Collar -->
    <!-- Left Collar -->
    <path d="M190 260 L140 290 L180 340 L220 295 Z" class="det-coat" />
    <path d="M190 260 L140 290 L180 340 L220 295 Z" class="det-line" fill="none" />
    <!-- Right Collar -->
    <path d="M270 260 L320 290 L280 340 L240 295 Z" class="det-coat" />
    <path d="M270 260 L320 290 L280 340 L240 295 Z" class="det-line" fill="none" />

    <!-- Red Tie / Investigation Accent -->
    <polygon points="225,295 235,295 238,360 230,375 222,360" fill="#C23B2B" class="det-red-fill" />
    <polygon points="223,285 237,285 235,296 225,296" fill="#A92D1F" />

    <!-- Neck / Chin -->
    <path d="M210 240 L210 280 L250 280 L250 240 Z" class="det-skin-shadow" />
    <path d="M205 210 Q230 270 255 210 Z" class="det-skin" />
    <path d="M205 210 Q230 270 255 210" class="det-line" fill="none" />

    <!-- Detective Hair (Sleek Stylized Silhouette) -->
    <path d="M185 200 C175 140 220 120 250 120 C280 120 315 145 305 200 C290 190 275 195 265 190 C250 180 230 180 215 190 C200 195 190 190 185 200 Z" class="det-dark-fill" />
    <path d="M195 170 Q215 140 245 145 Q220 160 210 185 Z" fill="#2E4473" opacity="0.6" />
    <!-- Front bangs / side strands -->
    <path d="M190 190 L180 230 L195 210 Z" class="det-dark-fill" />
    <path d="M270 180 L285 230 L275 205 Z" class="det-dark-fill" />

    <!-- Detective Round Wireframe Glasses -->
    <!-- Left Lens -->
    <circle cx="212" cy="205" r="16" class="det-glass-rim" />
    <path d="M204 196 L218 196 A12 12 0 0 1 224 208" class="det-glass-glare" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" />
    <!-- Right Lens -->
    <circle cx="248" cy="205" r="16" class="det-glass-rim" />
    <path d="M240 196 L254 196 A12 12 0 0 1 260 208" class="det-glass-glare" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" />
    <!-- Bridge -->
    <path d="M228 203 Q230 200 232 203" stroke="#C23B2B" stroke-width="2.5" class="det-red" fill="none" />
    <!-- Glasses Temples -->
    <line x1="196" y1="205" x2="185" y2="202" stroke="#C23B2B" stroke-width="2" class="det-red" />
    <line x1="264" y1="205" x2="275" y2="202" stroke="#C23B2B" stroke-width="2" class="det-red" />

    <!-- Subtle Eyes behind glasses -->
    <circle cx="212" cy="205" r="3.5" class="det-dark-fill" />
    <circle cx="248" cy="205" r="3.5" class="det-dark-fill" />
    <!-- Nose & Mouth (Minimal Japanese linework) -->
    <path d="M230 216 L227 225 L232 225" class="det-thin-line" fill="none" />
    <line x1="224" y1="238" x2="236" y2="238" class="det-thin-line" />
  </g>

  <!-- Open Investigation Notebook (Bottom Center-Left) -->
  <g transform="translate(90, 340)">
    <!-- Notebook Base -->
    <path d="M10 20 L95 10 L100 80 L15 90 Z" class="det-notebook" />
    <path d="M95 10 L180 20 L175 90 L100 80 Z" class="det-notebook" />
    <!-- Notebook Spine -->
    <line x1="97" y1="10" x2="100" y2="80" stroke="#C23B2B" stroke-width="2.5" class="det-red" />
    <!-- Notebook Ruled Lines / Code Notes -->
    <line x1="25" y1="30" x2="85" y2="23" class="det-thin-line" opacity="0.4" />
    <line x1="27" y1="45" x2="87" y2="38" class="det-thin-line" opacity="0.4" />
    <line x1="29" y1="60" x2="89" y2="53" class="det-thin-line" opacity="0.4" />
    <line x1="31" y1="75" x2="80" y2="70" class="det-thin-line" opacity="0.4" />

    <line x1="110" y1="23" x2="165" y2="30" class="det-thin-line" opacity="0.4" />
    <line x1="110" y1="38" x2="163" y2="45" class="det-thin-line" opacity="0.4" />
    <line x1="110" y1="53" x2="160" y2="60" class="det-thin-line" opacity="0.4" />
    <!-- Little Ink Feather / Pen Tip -->
    <path d="M170 15 L200 -10 L205 -5 L175 20 Z" fill="#C23B2B" class="det-red-fill" />
  </g>

  <!-- Prominent Magnifying Glass (Forefront Right) -->
  <g transform="translate(300, 270) rotate(-25)">
    <!-- Lens Reflection and Grid Reticle -->
    <circle cx="50" cy="50" r="45" fill="rgba(255, 255, 255, 0.25)" stroke="#1C2127" stroke-width="4" class="det-line" />
    <circle cx="50" cy="50" r="41" stroke="#C23B2B" stroke-width="2" class="det-red" fill="none" stroke-dasharray="8 4" />
    <!-- Magnified Code Symbol '{ }' or '?' -->
    <text x="50" y="58" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#C23B2B" text-anchor="middle" class="det-red-fill">&lt;/&gt;</text>
    <path d="M25 25 A 35 35 0 0 1 75 25" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Handle -->
    <path d="M50 95 L50 160 C50 165 42 170 38 165 L38 95 Z" fill="#1E2D4A" class="det-coat" />
    <rect x="42" y="95" width="12" height="70" rx="3" class="det-coat-shadow" />
    <rect x="40" y="93" width="16" height="8" rx="2" fill="#C23B2B" class="det-red-fill" />
  </g>

  <!-- Technical / Japanese Editorial Accents -->
  <g transform="translate(30, 460)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#667385" letter-spacing="1">ARCHIVE // FILE_ID: 0x7F2A · INVESTIGATION NOTES</text>
  </g>
</svg>
